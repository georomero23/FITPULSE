services:
  - type: web
    name: fitpulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Lo pegas manualmente en el dashboard de Render
      - key: JWT_SECRET
        generateValue: true  # Render genera uno seguro automáticamente
